name: swift build

jobs:
  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The SwiftPM package vends only an Objective-C library with no
      # test target, so we run `swift build` (not `swift test`) to prove
      # the package resolves and the host-platform build is clean.
      - run: swift build

"on":
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 0,1,2,3,4'
