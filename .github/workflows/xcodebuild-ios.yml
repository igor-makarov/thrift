name: xcodebuild iOS

# Build-only: the Package.swift has no test target (the pod ships only
# an Objective-C library), so `xcodebuild test` would have nothing to
# run. Building proves the library cross-compiles cleanly for iOS.

jobs:
  xcodebuild-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      # xcodebuild drives the SwiftPM package directly via the synthetic
      # scheme generated from Package.swift — no .xcodeproj / .xcworkspace
      # required. A generic destination is sufficient for a build-only
      # job and avoids tracking the current default simulator name.
      - run: xcodebuild build -scheme Thrift -destination 'generic/platform=iOS'

"on":
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 0,1,2,3,4'
